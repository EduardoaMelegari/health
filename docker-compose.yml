services:
  dieta-app:
    build: .
    container_name: dieta-app
    restart: unless-stopped
    ports:
      # host 8457 → 8080 do container (8080 já estava em uso no servidor)
      - "8457:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      # /export é barato (5 COUNTs) e passa pelo Flask + SQLite inteiros
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/export', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      - TZ=America/Sao_Paulo
      # Coach por chat (Claude API). Defina ANTHROPIC_API_KEY no ambiente ou num .env
      # ao lado deste compose. Sem a chave, o app funciona e a aba Coach fica inativa.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
